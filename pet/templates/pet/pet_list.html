{% extends 'base.html' %}

{% block content %}
    <h2>Lista de Pets</h2>
    <a href="{% url 'pet:criar' %}">+ Cadastrar Novo Pet</a>

    <ul>
        {% for pet in pets %}
            <li>
                <strong>{{ pet.nome }}</strong> - {{ pet.especie }} (Tutor: {{ pet.tutor.nome }})
                <a href="{% url 'pet:detalhar' pet.pk %}">Detalhes</a> |
                <a href="{% url 'pet:editar' pet.pk %}">Editar</a> |
                <a href="{% url 'pet:excluir' pet.pk %}">Deletar</a>
            </li>
        {% empty %}
            <li>Nenhum pet cadastrado até o momento.</li>
        {% endfor %}
    </ul>
{% endblock %}
