{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h2>Detalhes do Pet: {{ pet.nome }}</h2>
        </div>
        <div class="card-body">
            <p><strong>Nome:</strong> {{ pet.nome }}</p>
            <p><strong>Espécie:</strong> {{ pet.especie }}</p>
            <p><strong>Raça:</strong> {{ pet.raca }}</p>
            <p><strong>Data de Nascimento:</strong> {{ pet.data_nascimento|date:"d/m/Y" }}</p>
            <p><strong>Sexo:</strong> {{ pet.sexo }}</p>

            <div class="mt-4">
                <a href="{% url 'pet:listar' %}" class="btn btn-secondary">Voltar para a Lista</a>
                <a href="{% url 'pet:editar' pet.id %}" class="btn btn-warning">Editar</a>
                <a href="{% url 'pet:excluir' pet.id %}" class="btn btn-danger">Excluir</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
