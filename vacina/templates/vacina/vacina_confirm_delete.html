{% extends 'base.html' %}

{% block content %}
    <h1>Excluir Vacina</h1>

    <p>Tem certeza que deseja excluir "{{ vacina.nome }}"?</p>

    <form action="{% url 'vacina_delete' vacina.id %}" method="post">
    {% csrf_token %}
    <input type="submit" value="Confirmar exclusão">
    </form>

    <a href="{% url 'vacina_detail' vacina.id %}">Cancelar</a>
{% endblock %}
