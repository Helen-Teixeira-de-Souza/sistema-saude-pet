{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Excluir Exame</h2>
    <p>Tem certeza de que deseja excluir o exame <strong>{{ exame.nome }}</strong> do pet <strong>{{ exame.pet }}</strong>?</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sim, excluir</button>
        <a href="{% url 'exame_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
