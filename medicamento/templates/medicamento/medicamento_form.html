{% extends 'base.html' %}

{% block content %}
<div class="container-fluid">

    <!-- Page Heading -->
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">
            {% if medicamento %}Editar Medicamento{% else %}Registrar Novo Medicamento{% endif %}
        </h1>
        <a href="{% url 'medicamento:listar' %}" class="btn btn-secondary shadow-sm">
            <i class="fas fa-arrow-left fa-sm text-white-50 mr-1"></i> Voltar para a lista
        </a>
    </div>

    <!-- Form Card -->
    <div class="row justify-content-center">
        <div class="col-xl-8 col-lg-10 col-md-12">
            <div class="card shadow mb-4">
                <div class="card-header py-3 bg-primary">
                    <h6 class="m-0 font-weight-bold text-white">
                        <i class="fas fa-pills mr-2"></i> Formulário de Medicamento
                    </h6>
                </div>
                <div class="card-body">
                    <form action="{% if medicamento %}{% url 'medicamento:editar' medicamento.id %}{% else %}{% url 'medicamento:criar' %}{% endif %}" method="post">
                        {% csrf_token %}

                        <!-- Pet -->
                        <div class="form-group mb-3">
                            <label for="pet" class="font-weight-bold text-gray-700">Pet:</label>
                            <select name="pet" id="pet" class="form-control" required>
                                <option value="">-- Selecione o Pet --</option>
                                {% for pet in pet_list %}
                                    <option value="{{ pet.id }}" {% if medicamento.pet_id == pet.id %}selected{% endif %}>{{ pet.nome }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Consulta de Prescrição -->
                        <div class="form-group mb-3">
                            <label for="consulta" class="font-weight-bold text-gray-700">Consulta de prescrição:</label>
                            <select name="consulta" id="consulta" class="form-control">
                                <option value="">-- Nenhuma --</option>
                                {% for consulta in consulta_list %}
                                    <option value="{{ consulta.id }}" {% if medicamento.consulta_id == consulta.id %}selected{% endif %}>{{ consulta }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Nome do Medicamento -->
                        <div class="form-group mb-3">
                            <label for="nome" class="font-weight-bold text-gray-700">Nome do medicamento:</label>
                            <input type="text" name="nome" id="nome" class="form-control" value="{{ medicamento.nome|default:'' }}" placeholder="Ex: Omeprazol 20mg" required>
                        </div>

                        <!-- Dosagem -->
                        <div class="form-group mb-3">
                            <label for="dosagem" class="font-weight-bold text-gray-700">Dosagem:</label>
                            <input type="text" name="dosagem" id="dosagem" class="form-control" value="{{ medicamento.dosagem|default:'' }}" placeholder="Ex: 1 comprimido a cada 12 horas" required>
                        </div>

                        <!-- Frequência -->
                        <div class="form-group mb-3">
                            <label for="frequencia" class="font-weight-bold text-gray-700">Frequência:</label>
                            <input type="text" name="frequencia" id="frequencia" class="form-control" value="{{ medicamento.frequencia|default:'' }}" placeholder="Ex: 2 vezes ao dia" required>
                        </div>

                        <div class="row">
                            <!-- Data de Início -->
                            <div class="col-md-6 form-group mb-3">
                                <label for="data_inicio" class="font-weight-bold text-gray-700">Data de início:</label>
                                <input type="date" name="data_inicio" id="data_inicio" class="form-control" value="{{ medicamento.data_inicio|date:'Y-m-d'|default:'' }}" required>
                            </div>

                            <!-- Duração em Dias -->
                            <div class="col-md-6 form-group mb-3">
                                <label for="duracao_dias" class="font-weight-bold text-gray-700">Duração (dias):</label>
                                <input type="number" name="duracao_dias" id="duracao_dias" class="form-control" value="{{ medicamento.duracao_dias|default:1 }}" min="1" required>
                            </div>
                        </div>

                        <hr>

                        <!-- Botões de Ação -->
                        <div class="form-group mt-4 d-flex justify-content-between align-items-center mb-0">
                            <a href="{% url 'medicamento:listar' %}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-success px-4">
                                <i class="fas fa-save"></i> Salvar Medicamento
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
{% endblock %}
