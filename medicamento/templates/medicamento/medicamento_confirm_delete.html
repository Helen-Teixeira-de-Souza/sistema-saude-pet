{% extends 'base.html' %}

{% block content %}

<h1>Excluir Medicamento</h1>

<p>Tem certeza que deseja excluir "{{ medicamento.nome }}" do pet "{{ medicamento.pet.nome }}"?</p>

<form action="{% url 'medicamento:excluir' medicamento.id %}" method="post">
{% csrf_token %}
<input type="submit" value="Confirmar exclusão">
</form>

<a href="{% url 'medicamento:detalhar' medicamento.id %}">Cancelar</a>

{% endblock %}
