{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Excluir Tutor</h2>
    <p>Tem certeza de que deseja excluir o tutor <strong>{{ tutor }}</strong>?</p>
    <p class="text-danger">Os pets cadastrados para este tutor (e o histórico deles) também serão excluídos.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sim, excluir</button>
        <a href="{% url 'tutor:listar' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
