{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Excluir Consulta</h2>
    <p>Tem certeza de que deseja excluir a consulta do pet <strong>{{ consulta.pet }}</strong> na data <strong>{{ consulta.data }}</strong>?</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sim, excluir</button>
        <a href="{% url 'consulta_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
