{% extends 'base.html' %}

{% block content %}
    <h1>Excluir Vacinação</h1>

    <p>Tem certeza que deseja excluir a vacinação "{{ vacinacao.vacina.nome }}" do pet "{{ vacinacao.pet.nome }}"?</p>

    <form action="{% url 'vacinacao:excluir' vacinacao.id %}" method="post">
    {% csrf_token %}
    <input type="submit" value="Confirmar exclusão">
    </form>

    <a href="{% url 'vacinacao:detalhar' vacinacao.id %}">Cancelar</a>
{% endblock %}
