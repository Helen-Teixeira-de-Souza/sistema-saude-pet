{% extends 'base.html' %}

{% block content %}
    <h1>Excluir Cirurgia</h1>

    <p>Tem certeza que deseja excluir a cirurgia "{{ cirurgia.procedimento }}" do pet "{{ cirurgia.pet.nome }}"?</p>

    <form action="{% url 'excluir_cirurgia' cirurgia.id %}" method="post">
    {% csrf_token %}
    <input type="submit" value="Confirmar exclusão">
    </form>

    <a href="{% url 'detalhar_cirurgia' cirurgia.id %}">Cancelar</a>
{% endblock %}
