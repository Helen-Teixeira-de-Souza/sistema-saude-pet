<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senha Alterada - Saúde Pet</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card shadow-sm p-4">
                <div class="card-body">
                    <h3 class="card-title text-success mb-3">Senha alterada com sucesso!</h3>
                    <p class="card-text text-muted mb-4">
                        Sua senha foi redefinida com segurança. Agora você já pode fazer login no sistema.
                    </p>
                    <a href="{% url 'login' %}" class="btn btn-primary w-100">Ir para o Login</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
